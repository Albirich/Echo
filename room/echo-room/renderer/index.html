<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; img-src 'self' file: data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root">
        <div id="background"></div>

        <div id="stand"><img id="stand-img" alt=""></div>

        <div id="overlay">
            <div id="toolbar">
                <label>Scale <input type="range" id="stand-scale" min="40" max="200" value="100"></label>
                <span class="sep"></span>
                <label class="game-label">
                    Game
                    <select id="game-prompt">
                        <option value="">No game selected</option>
                    </select>
                </label>
                <span id="status"></span>
            </div>
            <div id="widgets"></div>
            <div id="clock"></div>
        </div>
    </div>

    <div id="chat-panel">
        <div id="chat-log"></div>
        <form id="chat-form" autocomplete="off">
            <input id="chat-input" placeholder="Type a message...">
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
